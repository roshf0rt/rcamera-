name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 26
        # Apple Log 2 (`AVCaptureColorSpace.appleLog2`) needs the iOS 26 SDK. Without an Xcode 26 the default
        # one builds, and the app simply has no Apple Log 2 setting.
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project RCamera.xcodeproj \
            -scheme RCamera \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee xcodebuild.log
      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" xcodebuild.log | sort -u | head -80 || true
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RCamera.app Payload/
          zip -qr RCamera-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RCamera-unsigned-ipa
          path: RCamera-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log

  rwater-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 26
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build RWater for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project RCamera.xcodeproj \
            -scheme RWater \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee xcodebuild.log
      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" xcodebuild.log | sort -u | head -80 || true
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RWater.app Payload/
          zip -qr RWater-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RWater-unsigned-ipa
          path: RWater-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rwater-xcodebuild-log
          path: xcodebuild.log
